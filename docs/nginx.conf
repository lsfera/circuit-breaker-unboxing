# Static docs. No upstreams, no state — the only things worth configuring are
# how a missing page reads and how long a browser is allowed to hold an asset.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Links between documents are written with their extension, so this is a
    # convenience rather than the mechanism: /architecture finds
    # architecture.html, the way GitHub Pages resolves it.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Fingerprintless filenames, so let a browser re-check rather than pin them
    # for a week: this image is rebuilt far more often than it is deployed.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
