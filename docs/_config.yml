# GitHub Pages, served from /docs on the default branch.
#
# The documents here are written to be read on GitHub as much as on the site,
# so nothing in them carries front matter and nothing was rewritten for Jekyll:
# `jekyll-optional-front-matter` renders them as they are, `jekyll-relative-links`
# turns `[x](foo.md)` into a working link, and `jekyll-titles-from-headings`
# takes each page's title from its own first heading. Links that leave `docs/`
# — source files, the README, the Dockerfile — are rewritten to GitHub blob
# URLs in the layout, because those targets are not part of the site.
title: Per-API egress circuit breaker events
description: >-
  Envoy outlier detection per replica, a quorum aggregator publishing one
  gapless event stream per API, and a RabbitMQ daemon fleet that throttles
  itself from it.
lang: en

# Optional. A project site served from <owner>.github.io/<repo>/ already names
# the repository in its own URL, and the layout derives the links from that, so
# this only needs setting behind a custom domain.
repo_url: ""

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-readme-index

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      # The documents are written for GitHub, and three of them contain `{{ }}`
      # that is not Liquid — a `docker inspect -f` format string and mermaid's
      # hexagon nodes. Rendering them through Liquid silently deletes both.
      # `index.html` turns this back on for itself.
      render_with_liquid: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
