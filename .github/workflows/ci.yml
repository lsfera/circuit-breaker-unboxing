# The repo's claim is that things are verified rather than reasoned about, so
# the checks that back that claim have to run on their own, on every push.
#
# Two jobs, split by what they need rather than by speed: `check` needs
# nothing but Node and is the gate; `integration` needs a Docker daemon,
# because it starts a real broker through Testcontainers. It's opt-in locally
# (`pnpm run test:rmq`) for exactly that reason — which makes it the suite
# most likely to rot unnoticed, and therefore the one most worth running here.
name: CI

on:
  push:
    branches: ['article/*']
  pull_request:
    branches: ['article/*']
  workflow_dispatch:

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'
      - uses: actions/setup-node@v7
        with:
          # The floor from package.json#engines, not "latest": the line the
          # images run, so CI type-checks against the Node that ships.
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc --noEmit` is load-bearing here rather than cosmetic — with no
      # build step it is the only thing that ever type-checks the source, and
      # Effect's guarantees are type-level.
      - run: pnpm run check

  integration:
    name: real RabbitMQ
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The broker properties this repo depends on — quorum delivery limits,
      # dead-letter provenance, durability — each pinned against a real
      # RabbitMQ.
      - run: pnpm run test:rmq

