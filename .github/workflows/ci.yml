# `check` needs only Node and is the gate. `integration` needs Docker for a real broker (Testcontainers); it is
# opt-in locally (`pnpm run test:rmq`), so it is the suite most likely to rot unnoticed.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # package.json#engines: the Node the images run.
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With no build step, this is the only type-check the source ever gets.
      - run: pnpm run check

  integration:
    name: real RabbitMQ
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:rmq

  # Builds the image only; every process needs a broker to run, so booting it is left to the compose stack.
  image:
    name: the application image builds
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t egress-breaker:ci .
      # Fails on a malformed compose file or a pinned digest that no longer resolves.
      - run: docker compose config > /dev/null
