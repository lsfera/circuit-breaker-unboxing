name: Site

# Builds docs/ into the project site and publishes it to GitHub Pages.
#
# The build is `docs/Dockerfile`, and what is deployed is extracted from the
# image it produces. That image is also how the site is read offline
# (`pnpm run site`), so there is one build rather than two that are supposed to
# match.
#
# The build runs on pull requests too, without deploying, because the site is
# the documentation: a diagram that stops rendering or a page that stops
# building is a documentation regression, and this is where it gets caught.
#
# Enable once, in Settings → Pages → Source: GitHub Actions. There is no
# `/docs` folder setting involved — that path pins Jekyll 3, which cannot turn
# Liquid off per page, and these documents contain `{{ }}` that is not Liquid.
# See docs/Gemfile for what that costs if you get it wrong.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A diagram mermaid cannot parse does not fail anything: it renders as a
      # grey "Syntax error in text" box where the explanation should be, and the
      # rest of the page is fine. Three of these were doing that against the
      # version the site vendored. So the diagrams are parsed here, against the
      # pin in docs/Dockerfile rather than against whatever is newest.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:diagrams

      # Buildx's docker-container driver, so the gem install and the mermaid
      # vendoring — the two slow, cacheable layers in docs/Dockerfile — can be
      # pulled from the GitHub Actions cache instead of redone on every run.
      - uses: docker/setup-buildx-action@v4

      - name: Build the site image
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # A project site is served from <owner>.github.io/<repo>/, so every
          # asset needs that prefix. A user or organisation site — the repo
          # literally named <owner>.github.io — is served from the root and
          # must not have one.
          base=""
          if [ "$REPO" != "$OWNER.github.io" ]; then base="/$REPO"; fi
          echo "building with baseurl '$base'"
          # --load: the next steps do `docker create`/`docker cp` against this
          # image by name, so it has to land in the local image store rather
          # than stay inside the buildx cache.
          docker buildx build -f docs/Dockerfile --build-arg BASEURL="$base" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t egress-site:ci .

      - name: Take the site out of the image
        # What gets published is what the image serves, extracted from it —
        # not a second build that happens to agree. The image is the artefact;
        # `pnpm run site` serves that same image offline.
        run: |
          id=$(docker create egress-site:ci)
          mkdir -p _site
          docker cp "$id:/usr/share/nginx/html/." _site
          docker rm "$id" >/dev/null

      - name: Check the image produced the pages it should
        # The Dockerfile asserts this too, on the build side. Re-checking here
        # covers the step in between: an extraction that copied nothing at all
        # leaves an empty directory and deploys a blank site.
        run: |
          pages=$(find _site -name '*.html' | wc -l)
          echo "$pages pages"
          test "$pages" -ge 30 || { echo "::error::only $pages pages extracted, expected 30+"; exit 1; }
          test -f _site/index.html || { echo "::error::no landing page"; exit 1; }
          test -f _site/assets/site.css || { echo "::error::stylesheet missing"; exit 1; }
          test -s _site/assets/vendor/mermaid.min.js || { echo "::error::mermaid not vendored"; exit 1; }

      - name: Check every internal link resolves
        # Against the built site rather than the markdown, because heading ids
        # are generated — kramdown's rule and GitHub's are not the same, so a
        # `#section` link can be right in one place and dangling in the other.
        run: node scripts/check-site-links.mjs _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
