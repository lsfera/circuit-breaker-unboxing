syntax = "proto3";

package io.prometheus.client;

// A deliberately partial copy of Prometheus's client_model, carrying only the
// fields this repo reads off Envoy's metrics stream.
//
// Partial is safe, and it is the reason there is no build step here. Protobuf
// addresses fields by number, and a decoder ignores fields it does not know
// about, so a schema that declares a subset with the *same numbers and types*
// decodes the real messages correctly. Vendoring the full client_model — and
// the tree of imports Envoy's own protos drag in (udpa, validate, xds
// annotations) — would buy nothing but files to keep in step.
//
// Numbers copied from prometheus/client_model at
// io/prometheus/client/metrics.proto. The original is proto2; proto3 encodes
// these same scalars identically on the wire, and presence is not something
// this reader depends on.
//
// What is left out: Summary, Histogram, Exemplar, created_timestamp, unit.
// Envoy sends histograms too; they arrive, are not decoded, and are ignored,
// which is exactly what the polling path does with them as well.

message LabelPair {
  string name = 1;
  string value = 2;
}

message Gauge {
  double value = 1;
}

message Counter {
  double value = 1;
}

message Metric {
  repeated LabelPair label = 1;
  Gauge gauge = 2;
  Counter counter = 3;
  int64 timestamp_ms = 6;
}

enum MetricType {
  COUNTER = 0;
  GAUGE = 1;
  SUMMARY = 2;
  UNTYPED = 3;
  HISTOGRAM = 4;
  GAUGE_HISTOGRAM = 5;
}

message MetricFamily {
  string name = 1;
  string help = 2;
  MetricType type = 3;
  repeated Metric metric = 4;
}
