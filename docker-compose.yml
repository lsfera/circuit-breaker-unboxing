# One producer, one broker, a fleet of competing-consumer daemons, each with its own circuit breaker whose open
# state is held by RabbitMQ (a consumer that is not consuming, and a token in the delay chain). See README.md.
#
# Every service also joins the host devcontainer's external network, so it can be reached by service name from
# outside this project; `default` is how services in this project reach each other.
networks:
  devcontainer:
    name: devcontainer
    external: true

# Resource limits: a container with no ceiling is sized by whatever the host had spare, which makes any number
# this stack publishes a property of the laptop it ran on rather than of the scenario. Starting points, not
# measured peaks.
x-limits-small: &limits-small { resources: { limits: { cpus: "0.50", memory: 256m } } }
x-limits-node: &limits-node { resources: { limits: { cpus: "1.00", memory: 512m } } }
x-limits-daemon: &limits-daemon { resources: { limits: { cpus: "2.00", memory: 512m } } }
x-limits-driver: &limits-driver { resources: { limits: { cpus: "1.00", memory: 256m } } }
x-limits-store: &limits-store { resources: { limits: { cpus: "1.00", memory: 768m } } }
x-limits-broker: &limits-broker { resources: { limits: { cpus: "2.00", memory: 2g } } }
x-limits-producer: &limits-producer { resources: { limits: { cpus: "${PRODUCER_CPUS:-1.00}", memory: 512m } } }

services:
  # A fake third party: configurable failure rate, hang, connection reset or delay via POST /__fail, and a
  # per-message audit trail via /__audit. Not part of the product, so it stays a bind-mounted file on the stock
  # Node image with no dependencies to install.
  flaky-upstream:
    image: &node-image node:26-alpine@sha256:ef24c5053d50fdc3e4e56eb4e7ddb7861874ab0fdc797046ba897581deb8e868
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/flaky-upstream.mjs:/app/flaky-upstream.mjs:ro"]
    command: node flaky-upstream.mjs
    # Only payments-provider's range: this scenario is one API, one address.
    ports: ["8080-8085:8080-8085"]
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-driver

  # The work queue lives here, over AMQP 0-9-1. The management UI on http://localhost:15672 (guest/guest) is how
  # you watch payments-provider.work's depth climb during an outage.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    # The broker's data lives under its node name, rabbit@<hostname>, and a
    # container's default hostname is its id. Without this, every recreation
    # boots a new, empty node beside the last one's queues.
    hostname: rabbitmq
    # 15692 is rabbitmq_prometheus, enabled by default in the management
    # image — queue depth and dead-letter growth come from there.
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # conf.d rather than replacing rabbitmq.conf: the image writes its own
      # there from the RABBITMQ_* environment, and this only adds to it.
      - $HOST_WORKSPACE_FOLDER/infra/rabbitmq.conf:/etc/rabbitmq/conf.d/10-egress.conf:ro
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-broker

  # The consumer application's ledger. The schema is infra/postgres/init.sql, run once on an empty volume; the
  # application assumes it exists.
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-ledger.sql:ro
      - postgres-data:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "consumer", "-d", "ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-store

  # The load: a steady stream onto payments-provider.work that never backs off and never reads whether the third
  # party is healthy. See packages/rmq-producer/src/producer.ts.
  rmq-producer: &rmq-node
    image: &app-image egress-breaker:dev
    build: &app-build
      context: .
      dockerfile: Dockerfile
    command: node packages/rmq-producer/src/main.ts
    environment: &rmq-node-env
      RMQ: rabbitmq:5672
      API_ID: payments-provider
      RATE_PER_SECOND: ${RATE_PER_SECOND:-200}
      METRICS_PORT: "9464"
    restart: unless-stopped
    depends_on: &rmq-depends
      rabbitmq: {condition: service_healthy}
    networks: [default, devcontainer]
    deploy: *limits-producer

  # The same producer for the refunds consumer, at a lower rate.
  rmq-producer-refunds:
    <<: *rmq-node
    environment:
      <<: *rmq-node-env
      API_ID: refunds-provider
      RATE_PER_SECOND: ${REFUNDS_RATE_PER_SECOND:-50}

  # One service, scaled: `docker compose up -d --scale rmq-consumer=N` is the whole of resizing the fleet. Every
  # replica is anonymous and runs the consumer application (packages/consumer), with one circuit breaker per
  # dependency (packages/rmq-consumer/src/Breaker.ts) whose open state is a token in RabbitMQ's delay chain; nothing
  # coordinates the fleet's breakers. Prometheus tells replicas apart by the IP DNS hands back for the service name
  # (see infra/monitoring/prometheus.yml).
  rmq-consumer:
    <<: *rmq-node
    command: node packages/consumer/src/main.ts
    environment:
      RMQ: rabbitmq:5672
      METRICS_PORT: "9464"
      DATABASE_URL: postgres://consumer:consumer@postgres:5432/ledger
      # One address, the fake third party directly: the address a real client of a real third party would be given.
      EGRESS_ADDR: http://flaky-upstream:8080
      API_PATH: /payments
      MAX_IN_FLIGHT: "20"
      # Trips after 5 calls fail in a row and stops consuming; a token sent
      # through the broker's delay chain brings the replica back for its
      # half-open probe after ~1s, and doubles per failed probe up to a day
      # (86400s; the chain counts to 131071s) if the third party stays down.
      BREAKER_THRESHOLD: "5"
      BREAKER_INITIAL_DELAY_SECONDS: "1"
      BREAKER_MAX_DELAY_SECONDS: "86400"
    deploy:
      replicas: 5
      <<: *limits-daemon
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # Scrapes RabbitMQ's own Prometheus plugin and both fleets' /metrics. See
  # infra/monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    networks: [default, devcontainer]
    deploy: *limits-store

  # Where rules.yml's alert goes (infra/monitoring/alertmanager.yml): grouped per dependency and forwarded to
  # the sink below.
  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    depends_on: [alert-sink]
    ports: ["9093:9093"]
    networks: [default, devcontainer]
    deploy: *limits-small

  # Stands in for Slack or PagerDuty: it logs what it is sent, so routing is something you can watch rather than
  # infer. Not the product, so it stays a bind-mounted file on the stock Node image like flaky-upstream.
  alert-sink:
    image: *node-image
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/alert-sink.mjs:/app/alert-sink.mjs:ro"]
    command: node alert-sink.mjs
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-small

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      # Grafana refuses a refresh under 5s unless told otherwise; the
      # dashboard asks for 1s so an incident is drawn as it happens.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The home dashboard for a signed-in user. The anonymous Viewer role cannot be granted access to it, so an
      # anonymous visit to :3000 still lands on Welcome: use the direct link in the README.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/in-process-breaker.json
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["3000:3000"]
    networks: [default, devcontainer]
    deploy: *limits-node

volumes:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  postgres-data:
