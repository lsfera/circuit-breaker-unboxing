# One producer, one broker, a fleet of competing-consumer daemons — each with
# its own in-process circuit breaker (cockatiel), private to that replica —
# plus a single aggregator that folds their transitions into one published
# verdict. The verdict is notification-only: no consumer reads it back, and
# each replica's own breaker still decides for itself exactly as before. See
# README.md.
#
# Every service also joins the host devcontainer's own external network so it
# can be reached directly by service name from outside this compose project.
# `default` remains how services in this project reach each other.
networks:
  devcontainer:
    name: devcontainer
    external: true

# Resource limits, same rationale as the full system this branch was pruned
# from: a container with no ceiling is sized by whatever the host had spare,
# which makes any number this stack publishes a property of the laptop it ran
# on rather than of the scenario. These are starting points, not measured
# peaks — nothing in this branch has been profiled the way the full system's
# `docs/measurements.md` was.
x-limits-small: &limits-small { resources: { limits: { cpus: "0.50", memory: 256m } } }
x-limits-node: &limits-node { resources: { limits: { cpus: "1.00", memory: 512m } } }
x-limits-daemon: &limits-daemon { resources: { limits: { cpus: "2.00", memory: 512m } } }
x-limits-driver: &limits-driver { resources: { limits: { cpus: "1.00", memory: 256m } } }
x-limits-store: &limits-store { resources: { limits: { cpus: "1.00", memory: 768m } } }
x-limits-broker: &limits-broker { resources: { limits: { cpus: "2.00", memory: 2g } } }
x-limits-producer: &limits-producer { resources: { limits: { cpus: "${PRODUCER_CPUS:-1.00}", memory: 512m } } }

services:
  # A fake third party: configurable failure rate, hang, connection reset or
  # delay via POST /__fail, and a per-message audit trail via /__audit. Not
  # part of the product, so it stays a bind-mounted file on the stock Node
  # image with no dependencies to install.
  flaky-upstream:
    image: &node-image node:26-alpine@sha256:ef24c5053d50fdc3e4e56eb4e7ddb7861874ab0fdc797046ba897581deb8e868
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/flaky-upstream.mjs:/app/flaky-upstream.mjs:ro"]
    command: node flaky-upstream.mjs
    # Only payments-provider's range: this scenario is one API, one address —
    # there is no proxy here to spread load across the other five hosts the
    # full system's Envoy config ejects individually.
    ports: ["8080-8085:8080-8085"]
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-driver

  # The control plane and the work queue both live here, over AMQP 0-9-1.
  # Management UI on http://localhost:15672 (guest/guest) is how you watch
  # payments-provider.work's depth climb during an outage — the single most
  # legible view of what this fleet does, or rather does not do, about it.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    # The broker's data lives under its node name, rabbit@<hostname>, and a
    # container's default hostname is its id. Without this, every recreation
    # boots a new, empty node beside the last one's queues.
    hostname: rabbitmq
    # 15692 is rabbitmq_prometheus, enabled by default in the management
    # image — queue depth and dead-letter growth come from there.
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # conf.d rather than replacing rabbitmq.conf: the image writes its own
      # there from the RABBITMQ_* environment, and this only adds to it.
      - $HOST_WORKSPACE_FOLDER/infra/rabbitmq.conf:/etc/rabbitmq/conf.d/10-egress.conf:ro
    restart: unless-stopped
    networks: [default, devcontainer]
    deploy: *limits-broker

  # The load: a steady stream onto payments-provider.work, never backing off,
  # never reading anything about whether the third party is healthy — because
  # there is nothing yet to read. See packages/rmq-producer/src/producer.ts.
  rmq-producer: &rmq-node
    image: &app-image egress-breaker:dev
    build: &app-build
      context: .
      dockerfile: Dockerfile
    command: node packages/rmq-producer/src/main.ts
    environment: &rmq-node-env
      RMQ: rabbitmq:5672
      API_ID: payments-provider
      RATE_PER_SECOND: ${RATE_PER_SECOND:-200}
      METRICS_PORT: "9464"
    restart: unless-stopped
    depends_on: &rmq-depends
      rabbitmq: {condition: service_healthy}
    networks: [default, devcontainer]
    deploy: *limits-producer

  # One service, scaled — `docker compose up -d --scale rmq-consumer=N` is
  # the whole of resizing the fleet. Every replica is anonymous: there is no
  # hash-space position, no floor, no election, and its in-process circuit
  # breaker (packages/consumer/src/Breaker.ts) still decides entirely for
  # itself — the `aggregator` service below only listens to what each
  # replica publishes, it never talks back. Prometheus tells replicas apart
  # by the IP DNS hands back for the service name (see
  # infra/monitoring/prometheus.yml); `circuit.control` events carry their
  # own random instance id instead, since an AMQP event has no IP to reuse.
  rmq-consumer:
    <<: *rmq-node
    command: node packages/consumer/src/main.ts
    environment:
      <<: *rmq-node-env
      # One address, the fake third party directly — no proxy, no LB we
      # control. This is the address a real client of a real third party
      # would be given: everything behind it is opaque.
      EGRESS_ADDR: http://flaky-upstream:8080
      API_PATH: /payments
      MAX_IN_FLIGHT: "20"
      # Trips after 5 calls fail in a row; the half-open probe starts 1s
      # after that and doubles (cockatiel's own exponential-backoff-with-
      # jitter default) up to 30s if the probe keeps failing.
      BREAKER_THRESHOLD: "5"
      BREAKER_INITIAL_DELAY_MS: "1000"
      BREAKER_MAX_DELAY_MS: "30000"
    deploy:
      replicas: 5
      <<: *limits-daemon
    depends_on: *rmq-depends

  # Folds every replica's own breaker transitions (published to
  # circuit.control, off the hot path — see consumer.ts's onStateChange) into
  # one published verdict per apiId. Deliberately not scaled: a single
  # instance, no leader election, no persistence — a real, named SPOF this
  # branch doesn't hide. Never in the request path: no rmq-consumer service
  # reads anything this one publishes. See README.md.
  aggregator:
    <<: *rmq-node
    command: node packages/aggregator/src/main.ts
    environment:
      RMQ: rabbitmq:5672
      METRICS_PORT: "9464"
      # Half the known fleet reporting open/half_open before the published
      # verdict itself opens; a replica unheard-from for a minute stops
      # counting toward that fraction (see Verdict.ts's prune).
      VERDICT_THRESHOLD: "0.5"
      STALENESS_MS: "60000"
    deploy: *limits-small
    depends_on: *rmq-depends

  # Scrapes RabbitMQ's own Prometheus plugin and both fleets' /metrics. See
  # infra/monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    networks: [default, devcontainer]
    deploy: *limits-store

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Without this, :3000 lands on Grafana's own "Welcome" screen — not this
      # dashboard — and the first thing anyone sees looks like nothing was
      # provisioned at all. Path is inside the container, off the same
      # read-only mount the dashboard provisioner already uses.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/in-process-breaker.json
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["3000:3000"]
    networks: [default, devcontainer]
    deploy: *limits-node

volumes:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
