# Three Envoy replicas against shared upstreams. The replicas each run their own
# outlier detection and will legitimately disagree — that divergence is the
# thing the aggregator exists to resolve.
#
# Every service also joins the host devcontainer's own external network so it
# can be reached directly by service name from outside this compose project
# (e.g. a devcontainer shell), not just from other containers in this stack.
# `default` remains how services in this project reach each other — nothing
# about that changes.
networks:
  devcontainer:
    name: devcontainer
    external: true

# Shared by every rmq-daemon-* below. Anchored separately from the service
# anchor because YAML's `<<:` replaces a key wholesale rather than merging
# into it — a daemon that redeclared `environment:` to set its own
# DAEMON_INDEX would otherwise drop every other variable. Merging at the map
# level instead keeps the differing value to one line per daemon.
x-daemon-env: &daemon-env
  RMQ: rabbitmq:5672
  API_ID: payments-provider
  FLEET_SIZE: "5"
  # One address, no replica names, no admin ports — a daemon is a client of
  # the egress listener and knows nothing about Envoy's topology, exactly
  # like infra/traffic-generator.mjs.
  EGRESS_ADDR: http://envoy:10000
  API_PATH: /payments
  # Each daemon serves the same /metrics route the aggregator does, from the
  # same in-process effect registry. Not published to the host: Prometheus
  # scrapes them by service name on this network (infra/monitoring/
  # prometheus.yml), so five identical port numbers never collide.
  METRICS_PORT: "9464"
  # Self-healing for the dead-letter queue: when the circuit closes, one
  # daemon — elected by the broker on a second SAC queue — replays
  # payments-provider.work.dead back onto the work queue. On here because the
  # demo is precisely about recovering from a third-party outage; off by
  # default in code, because whether stale work is still worth doing is a
  # question about the workload rather than about the transport.
  REDRIVE_ON_CLOSE: "true"
  REDRIVE_MAX: "5000"

services:
  # Stays on the stock Node image with a single file bind-mounted: this is a
  # fake third party, not part of the product, and it has no dependencies to
  # install. Putting it in the application image would ship the test fixture
  # inside the artifact.
  flaky-upstream:
    image: &node-image node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/flaky-upstream.mjs:/app/flaky-upstream.mjs:ro"]
    command: node flaky-upstream.mjs
    # One port per upstream endpoint: 8080-8085 payments-provider, 8090-8093
    # shipping-rates, 8094-8096 tax-calc — the same endpoint counts the
    # simulated fleet uses, so both FleetSource layers can reach the same
    # states. See infra/flaky-upstream.mjs for why one host per cluster
    # cannot. Two ranges rather than one because 8088/8089 belong to the
    # aggregator pair below, and a contiguous range through them fails to
    # bind.
    ports: ["8080-8085:8080-8085", "8090-8096:8090-8096"]
    restart: unless-stopped
    networks: [default, devcontainer]

  # envoy-01/02 merge in everything from envoy-00 via the &envoy/<<: anchor —
  # same image, config and command — and only override the admin port mapping,
  # so all three run identically and stay in sync by construction.
  envoy-00: &envoy
    image: envoyproxy/envoy:v1.31-latest@sha256:caa5b411be1633b90023592a34a7e010c933d6e60206c758f631485e53006865
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    # List (exec) form, so these are argv straight to the envoy binary — no
    # shell involved, so none of the sh -c/YAML-folding pitfalls below apply.
    # --service-node is what a pushed stats stream identifies itself by: the
    # aggregator polls by URL and therefore names replicas itself, but a replica
    # that pushes has to say who it is, once, in the first message of the
    # stream. Each replica overrides this; without it all three arrive as one.
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "egress", "--service-node", "envoy-00"]
    restart: unless-stopped
    depends_on: [flaky-upstream]
    ports: ["19001:9901"]
    # All three replicas answer to this one alias on the data-plane port.
    # Anything that is a *client* of the egress listener (traffic generator,
    # a real service) resolves "envoy" and never learns there are three of
    # them or what they're individually named — that topology stays known to
    # exactly one thing: the aggregator, which polls envoy-00/01/02's admin
    # ports by name below because per-replica polling is its actual job.
    networks:
      default:
        aliases: [envoy]
      devcontainer: {}
  envoy-01:
    <<: *envoy
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "egress", "--service-node", "envoy-01"]
    ports: ["19002:9901"]
  envoy-02:
    <<: *envoy
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "egress", "--service-node", "envoy-02"]
    ports: ["19003:9901"]

  # Backs LeaderElection/CheckpointStore (Coordination.ts) for the two
  # aggregator instances below — no bind mount, so this one needed nothing
  # special to run even before HOST_WORKSPACE_FOLDER was set correctly.
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # AOF, because this is the checkpoint store. Without persistence a restart
    # loses every checkpoint, and a newly promoted leader resumes from nothing
    # rather than from where the last one stopped — a sequence reset, which is
    # the one thing the published contract promises never happens. Fencing is
    # safe across a wipe (tokens carry an epoch, see Coordination.ts), but safe
    # is not the same as intact.
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    networks: [default, devcontainer]

  # The control plane and the work queue both live here. 4.x specifically:
  # this repo speaks AMQP 1.0 natively (see docs/rmq-control-plane.md), which
  # is RabbitMQ 4's own protocol rather than a plugin over 0-9-1. Management
  # UI on http://localhost:15672 (guest/guest) is how you watch
  # payments-provider.work's depth climb during an outage and drain on the
  # ramp back — the single most legible view of what this fleet does.
  rabbitmq:
    image: rabbitmq:4.0-management-alpine@sha256:d808ad631ae0a8182bbba362ffbd5408c27e90dddfa1b0ca2f4bbdce126ce3bf
    # 15692 is rabbitmq_prometheus, enabled by default in the management
    # image — the per-queue depth on the Grafana dashboard comes from there,
    # so the queue filling and draining is visible in the same place as the
    # circuit that caused it, not only in the management UI.
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    # Everything downstream gates on this rather than on container start:
    # a daemon that connects before the broker is listening just dies, and
    # `depends_on` alone does not wait for readiness.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Durable quorum queues keep their messages across a broker *restart*; they
    # keep them across a container being recreated only if the broker's data
    # directory outlives the container. Both halves are needed, and only one of
    # them is a queue argument.
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    restart: unless-stopped
    networks: [default, devcontainer]

  # Two real instances against the shared Redis lease, not one — this is
  # what makes HA a demonstrated property of the stack instead of a design
  # only exercised in tests. `egress_aggregator_is_leader` on whichever one
  # is currently active reads 1; the other reads 0 and is doing nothing but
  # trying to acquire. Kill the leader's container and the other takes over
  # within lease_ttl_ms, resuming `sequence` from its last checkpoint rather
  # than restarting at zero — the same property Coordination.test.ts and
  # RedisCoordination.test.ts prove, now visible from outside the process.
  aggregator: &aggregator
    # One image for every process this repo runs — see Dockerfile. Built here
    # rather than bind-mounted: what runs is an artifact with its dependencies
    # already inside it, so cold start is a container start rather than a pnpm
    # install, and the thing that boots is the thing that was built.
    image: &app-image egress-breaker:dev
    build: &app-build
      context: .
      dockerfile: Dockerfile
    # Runs main.ts against the three real Envoy replicas, which push their
    # stats here over gRPC (not the sim fleet — --source=envoy-push is what
    # makes this stack's outlier detection real instead of simulated), with
    # Redis-backed HA instead of the in-memory default, since two instances
    # are genuinely competing here. --source=envoy is the polling alternative;
    # see "Ingestion" in README.md for the measurement that chose between them.
    #
    # Keep node's args after "src/main.ts" on this one line. With YAML `>`
    # folding, only lines indented the SAME as the first content line
    # ("sh -c ...") get their newline folded to a space; lines indented
    # further keep a literal newline. Splitting --source=... /
    # --envoy=... onto their own (more-indented) lines silently turned them
    # into separate shell commands that never reached node's argv — the
    # aggregator ran in sim mode with no error, so nothing looked wrong until
    # a demo run against real Envoy never tripped the circuit.
    # --rmq mounts AmqpControlPlaneSink *alongside* the webhook sink, so the
    # SSE/subscriber demo is untouched and the daemon fleet below also gets
    # every event on circuit.control. Only the leader publishes, so the two
    # instances never double-deliver.
    command: >
      node --experimental-strip-types packages/aggregator/src/main.ts --source=envoy-push --push-port=9900 --ha=redis --redis=redis://redis:6379 --rmq=rabbitmq:5672 --instance-id=aggregator-1
    # Restarting matters more here than it looks: a killed leader whose
    # container never comes back leaves the survivor with nowhere to fail
    # over to next time, so the second failover in a demo has no candidate.
    restart: unless-stopped
    depends_on:
      envoy-00: {condition: service_started}
      envoy-01: {condition: service_started}
      envoy-02: {condition: service_started}
      redis: {condition: service_started}
      rabbitmq: {condition: service_healthy}
    ports: ["8088:8088"]
    networks: [default, devcontainer]

  aggregator-2:
    <<: *aggregator
    command: >
      node --experimental-strip-types packages/aggregator/src/main.ts --source=envoy-push --push-port=9900 --ha=redis --redis=redis://redis:6379 --rmq=rabbitmq:5672 --instance-id=aggregator-2
    ports: ["8089:8088"]

  # The scenario from docs/rmq-control-plane.md, running for real: a producer
  # flooding payments-provider.work, and five competing consumers draining it
  # through the egress listener, one third-party call per message.
  #
  # Five separate containers, not one process simulating five daemons. That
  # matters twice over: DaemonPolicy's active-count decision is only
  # meaningful if the daemons are independently killable, and the HALF_OPEN
  # prober election is x-single-active-consumer contended by five real
  # connections rather than five fibers sharing one.
  rmq-producer: &rmq-node
    image: *app-image
    build: *app-build
    command: >
      node --experimental-strip-types packages/rmq-producer/src/main.ts
    environment:
      RMQ: rabbitmq:5672
      API_ID: payments-provider
      RATE_PER_SECOND: "200"
      METRICS_PORT: "9464"
    # Restarting is what makes main.ts's stance on crashes coherent: it lets
    # exactly one library race through an uncaughtException handler and
    # treats everything else as fatal, on the grounds that a daemon
    # swallowing its own bugs is worse than one that restarts. Without a
    # policy here, "restarts" was wishful — the container just stayed dead.
    restart: unless-stopped
    depends_on: &rmq-depends
      rabbitmq: {condition: service_healthy}
    networks: [default, devcontainer]

  rmq-daemon-0: &rmq-daemon
    <<: *rmq-node
    command: >
      node --experimental-strip-types packages/rmq-consumer/src/main.ts
    environment:
      <<: *daemon-env
      DAEMON_INDEX: "0"
      # Names the daemon's own control queue. Fixed rather than random so a
      # restarted daemon reuses its queue instead of orphaning the old one —
      # which is exactly what happens now that these containers restart.
      INSTANCE_ID: daemon-0
    depends_on:
      <<: *rmq-depends
      envoy-00: {condition: service_started}
  rmq-daemon-1:
    <<: *rmq-daemon
    environment:
      <<: *daemon-env
      DAEMON_INDEX: "1"
      INSTANCE_ID: daemon-1
  rmq-daemon-2:
    <<: *rmq-daemon
    environment:
      <<: *daemon-env
      DAEMON_INDEX: "2"
      INSTANCE_ID: daemon-2
  rmq-daemon-3:
    <<: *rmq-daemon
    environment:
      <<: *daemon-env
      DAEMON_INDEX: "3"
      INSTANCE_ID: daemon-3
  rmq-daemon-4:
    <<: *rmq-daemon
    environment:
      <<: *daemon-env
      DAEMON_INDEX: "4"
      INSTANCE_ID: daemon-4

  # Without this, /__fail changes nothing: outlier detection only reacts to
  # requests it actually sees. Part of the default `docker compose up`, not
  # optional — same role flaky-upstream itself plays.
  traffic:
    image: *node-image
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/traffic-generator.mjs:/app/traffic-generator.mjs:ro"]
    command: node traffic-generator.mjs
    environment:
      # One address, same one any real client would use. The generator
      # discovers the replicas behind it via DNS (see the alias on the envoy
      # services above) rather than being handed their names directly.
      EGRESS_ADDR: http://envoy:10000
    restart: unless-stopped
    depends_on: [envoy-00, envoy-01, envoy-02]
    networks: [default, devcontainer]

  # Runs demo/driver.ts against this stack, end to end: `docker compose
  # --profile demo run --rm demo` (or `-- shipping-rates` for a different API).
  # Not part of plain `docker compose up` — this is a one-shot, not a daemon.
  demo:
    image: *app-image
    build: *app-build
    # Runs the driver (see the module comment in
    # demo/driver.ts for what it does). No extra node args here, but if any
    # get added, keep them on this same line — see the aggregator command
    # above for why a more-indented continuation line breaks silently.
    command: >
      node --experimental-strip-types packages/demo/src/driver.ts
    environment:
      # Both instances, because only the leader publishes and which one that
      # is depends on who won the lease — the driver resolves it at startup.
      AGGREGATOR: http://aggregator:8088,http://aggregator-2:8088
      FAILURE_MODE: envoy
      FLAKY_UPSTREAM: http://flaky-upstream
      # Lets the driver assert the daemon fleet's reaction too, not just the
      # aggregator's published stream — it reads egress_daemon_* and the
      # broker's queue depths back out of Prometheus. Unset, that step is
      # skipped rather than failed.
      PROMETHEUS: http://prometheus:9090
    # No restart policy: this one is a one-shot that is supposed to exit.
    depends_on:
      aggregator: {condition: service_started}
      traffic: {condition: service_started}
    profiles: [demo]
    networks: [default, devcontainer]

  # Scrapes the aggregator's /metrics (same registry the console reads from)
  # plus each Envoy's native /stats/prometheus. See monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Otherwise every incident this stack demonstrates is gone the moment the
      # container is recreated, including the ones worth comparing against.
      - prometheus-data:/prometheus
    # Lets Prometheus also reach `pnpm start` running on the host, so the same
    # stack works for the sim-fleet demo, not just this docker-compose one.
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    ports: ["9090:9090"]
    networks: [default, devcontainer]

  # Where alerts.yml's rules actually go. Prometheus evaluated them and routed
  # them nowhere until now, which is the same failure shape the rules are about:
  # something that looks fine because it is running.
  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    depends_on: [alert-sink]
    ports: ["9093:9093"]
    networks: [default, devcontainer]

  # Stands in for Slack or PagerDuty: it logs what it is sent, so routing is
  # something you can watch rather than infer. Not the product, so it stays a
  # bind-mounted file on the stock Node image like the other fixtures.
  alert-sink:
    image: *node-image
    working_dir: /app
    volumes: ["$HOST_WORKSPACE_FOLDER/infra/alert-sink.mjs:/app/alert-sink.mjs:ro"]
    command: node alert-sink.mjs
    restart: unless-stopped
    networks: [default, devcontainer]

  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Viewer, not Editor: the dashboard is provisioned from a file in this
      # repo, and an anonymous visitor being able to overwrite it means the
      # thing you demo and the thing in git quietly stop matching.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - $HOST_WORKSPACE_FOLDER/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["3000:3000"]
    networks: [default, devcontainer]

# Named, not bind-mounted: this is service state, not repo content, and it must
# survive a container being recreated. Everything stateful in the stack has one
# now — before this, "durable" was a property of a queue in a broker whose
# entire data directory lived in a container's writable layer.
volumes:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
