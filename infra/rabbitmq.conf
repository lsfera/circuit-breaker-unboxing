# The broker's own memory ceiling, declared rather than derived.
#
# RabbitMQ sizes `vm_memory_high_watermark` from what it believes total memory
# to be, and under cgroup v2 it does not read the container's limit: with
# `deploy.resources.limits.memory: 2g` in docker-compose.yml, the broker still
# logs total memory as the host's — 4.0.9 did, and 4.3.5 still does:
#
#   Memory high watermark set to 28853 MiB (30255088435 bytes)
#     of 48089 MiB (50425147392 bytes) total
#
# — the host's RAM, not the container's 2 GiB. Two things follow, and both are
# bad for a stack whose whole subject is a queue that fills up. The watermark
# is a function of whoever's laptop this is, so flow control engages at a
# different depth on every machine; and it is set so far above the container
# limit that the OOM killer would reach the broker first, which is not flow
# control, it is a broker that vanishes mid-incident.
#
# 1 GiB against the 2 GiB limit: two and a half times the 391 MiB this stack's
# deepest measured backlog cost, and half the ceiling the kernel enforces, so
# there is room for the broker to refuse publishes and stay alive doing it.
#
# RABBITMQ_VM_MEMORY_HIGH_WATERMARK would have been one line in the compose
# file; RabbitMQ 4 removed it — the image refuses to start with
# "deprecated environment variables detected" — so it is a config file now.
vm_memory_high_watermark.absolute = 1GiB
