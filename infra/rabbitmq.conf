# The broker's own memory ceiling, declared rather than derived. Under cgroup v2 RabbitMQ does not read the
# container's memory limit and sizes `vm_memory_high_watermark` from the host's RAM (4.0.9 and 4.3.5 alike), so
# flow control would engage at a different depth on every machine and sit so far above the container limit that
# the OOM killer would reach the broker first.
#
# 1 GiB against the 2 GiB limit leaves room for the broker to refuse publishes and stay alive doing it.
# `RABBITMQ_VM_MEMORY_HIGH_WATERMARK` is refused by the RabbitMQ 4 image, so this is a config file.
vm_memory_high_watermark.absolute = 1GiB
