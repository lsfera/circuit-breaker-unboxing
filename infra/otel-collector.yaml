# Tail sampling: decide what to keep once a trace is finished, not before it
# starts.
#
# Every process here exports every span (see packages/tracing/src/Tracing.ts).
# That is only affordable because this processor throws most of them away —
# but it throws them away *knowing how the trace turned out*, which is the
# whole point. A head sampler keeping 5% would keep a random 5%; the failed
# call and the nine-second message would be in the other 95% nineteen times
# out of twenty.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  tail_sampling:
    # How long to hold a trace before judging it. It has to outlast the slowest
    # thing worth catching: the daemon's egress call times out at 2s, and an
    # OPEN circuit adds the probe cycle on top, so 10s leaves room without
    # holding the buffer open all day.
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 400
    policies:
      # Anything that failed, in full. This is the policy that earns the cost
      # of exporting everything.
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }

      # Anything slow, whether or not it failed. "Why did this one take nine
      # seconds" is the question 003 said tracing was for, and this is the
      # policy that answers it.
      - name: slow
        type: latency
        latency: { threshold_ms: 1000 }

      # A message the daemon could not complete and handed back to the broker.
      # Not an error at the span level — the system did the right thing — but
      # it is the shape of trace someone debugging a backlog wants to see.
      - name: requeued-or-dead-lettered
        type: string_attribute
        string_attribute:
          key: egress.settlement
          values: [requeue, discard]

      # Enough of the ordinary to know what ordinary looks like. Without this
      # the only traces kept are the bad ones, and there is nothing to compare
      # them against.
      - name: baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 2 }

  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      # tail_sampling before batch: batching first would hand the sampler
      # groups of unrelated spans and it needs whole traces.
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/jaeger]
  telemetry:
    logs:
      level: warn
