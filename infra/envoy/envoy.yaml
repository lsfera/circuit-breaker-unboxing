# Egress proxy. ONE CLUSTER PER API - that is what makes per-API events
# possible, because every stat, outlier event and access-log record is keyed by
# cluster name. Traffic routed through a catch-all cannot produce per-API state.
#
# Envoy's outlier detection here is per replica and stays that way: it protects
# the request path immediately. The aggregator decides what the fleet as a whole
# reports to subscribers.
#
# The three clusters are identical apart from name and endpoints, so the shared
# blocks are declared once on the first cluster and aliased by the other two.
# Plain YAML anchors, not merge keys: Envoy parses this with yaml-cpp, which
# resolves aliases but does not implement the `<<:` merge key, so a merged map
# would arrive as a literal "<<" field and fail proto validation.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

# Push the stats to the aggregators instead of making them come and get it.
#
# One sink per aggregator instance, and that is not redundancy — it is
# correctness. A stats sink names one gRPC cluster; put both aggregators in one
# cluster and Envoy load-balances the stream, so each instance would see some
# replicas and compute a quorum from a partial fleet. Two sinks means every
# instance sees every replica, which is what the polling path gave for free by
# asking all three itself.
#
# The interval is the detection latency of the push path, the way tickMs is for
# the polling path — and it is the whole cost side of the comparison, because
# Envoy serialises *every* stat it holds on each flush, not the handful the
# aggregator's regex keeps.
stats_flush_interval: 0.25s

stats_sinks:
  - name: envoy.stat_sinks.metrics_service
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
      transport_api_version: V3
      grpc_service:
        envoy_grpc:
          cluster_name: aggregator_metrics_1
      # Names must stay in Envoy's own dotted form
      # (cluster.payments-provider.membership_healthy) — with tags emitted as
      # labels the name is shortened and the aggregator's parser, which is
      # shared with the polling path, matches nothing at all.
      emit_tags_as_labels: false
  - name: envoy.stat_sinks.metrics_service
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
      transport_api_version: V3
      grpc_service:
        envoy_grpc:
          cluster_name: aggregator_metrics_2
      emit_tags_as_labels: false

cluster_manager:
  outlier_detection:
    # Discrete ejection/un-ejection records, one JSON object per line.
    # This is a genuine event stream, unlike the *_overflow counters.
    event_log_path: /dev/stdout

static_resources:
  listeners:
    - name: egress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress
                # Errors only: at this request rate a full access log is noise,
                # and the responses worth keeping are rare enough to be free.
                #
                # RESPONSE_CODE_DETAILS is the field that matters — Envoy reports
                # reached_concurrency_limit, no_healthy_upstream, route_not_found
                # and the rest only here, never on the response, so without this a
                # 5xx the proxy generated itself leaves no trace of why. See
                # docs/decisions/010-a-proxy-that-fails-on-its-own-behalf.md.
                access_log:
                  - name: envoy.access_loggers.stdout
                    filter:
                      status_code_filter:
                        comparison:
                          op: GE
                          value: { default_value: 400, runtime_key: access_log.min_status }
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          details: "%RESPONSE_CODE_DETAILS%"
                          flags: "%RESPONSE_FLAGS%"
                          cluster: "%UPSTREAM_CLUSTER%"
                          upstream: "%UPSTREAM_HOST%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: egress_routes
                  virtual_hosts:
                    - name: egress
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/payments" }
                          route:
                            cluster: payments-provider
                            timeout: 5s
                            retry_policy: &retry_policy
                              # No retry_budget here, and with several
                              # endpoints per cluster that now matters: a
                              # retry lands on a *different* host, so it is
                              # genuine failover rather than the same dying
                              # host hit three times. A budget capping
                              # concurrent retries as a fraction of active
                              # requests is still the better shape at real
                              # fleet size - see the README.
                              retry_on: 5xx,reset,connect-failure
                              num_retries: 2
                              retry_back_off:
                                base_interval: 0.05s
                                max_interval: 1s
                        - match: { prefix: "/shipping" }
                          route:
                            cluster: shipping-rates
                            timeout: 5s
                            retry_policy: *retry_policy
                        - match: { prefix: "/tax" }
                          route:
                            cluster: tax-calc
                            timeout: 5s
                            retry_policy: *retry_policy
                http_filters:
                  # Layer 4 (see README) - infers a concurrency limit from
                  # observed latency instead of a hand-picked static number.
                  # Applies fleet-wide across every cluster on this listener,
                  # which is the point for egress: you don't know a third-party
                  # upstream's real capacity, so a fixed max_requests threshold
                  # is either too conservative or too late.
                  - name: envoy.filters.http.adaptive_concurrency
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.adaptive_concurrency.v3.AdaptiveConcurrency
                      gradient_controller_config:
                        sample_aggregate_percentile:
                          value: 50
                        concurrency_limit_params:
                          concurrency_update_interval: 0.1s
                        min_rtt_calc_params:
                          interval: 30s
                          request_count: 50
                          jitter:
                            value: 15
                          min_concurrency: 4
                          buffer:
                            value: 25
                      # 429, not the default 503: a request shed here never reached the
                      # third party, and the daemons must be able to tell it apart from a
                      # 5xx the upstream returned, or shedding spends messages' delivery budget.
                      concurrency_limit_exceeded_status:
                        code: TooManyRequests
                      enabled:
                        default_value: true
                        runtime_key: "adaptive_concurrency.enabled"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # The two metrics sinks above. gRPC, so HTTP/2 has to be explicit — an
    # upstream left to negotiate it will speak HTTP/1.1 and the sink will fail
    # every flush with a protocol error rather than a connection error, which
    # reads like an application bug.
    - name: aggregator_metrics_1
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options: &grpc_http2
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: aggregator_metrics_1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: aggregator, port_value: 9900 }
    - name: aggregator_metrics_2
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options: *grpc_http2
      load_assignment:
        cluster_name: aggregator_metrics_2
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: aggregator-2, port_value: 9900 }

    - name: payments-provider
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: payments-provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8080 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8081 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8082 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8083 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8084 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8085 }
      # Layer 1 - bulkheading. Caps resource consumption; detects nothing.
      # track_remaining exposes gauges rather than bare overflow counters,
      # which is what the aggregator edge-detects on.
      circuit_breakers: &circuit_breakers
        thresholds:
          - priority: DEFAULT
            max_connections: 512
            max_pending_requests: 256
            max_requests: 1024
            max_retries: 32
            track_remaining: true
      # Layer 2 - the actual breaker. Per replica, by design.
      outlier_detection: &outlier_detection
        consecutive_5xx: 5
        consecutive_gateway_failure: 5
        enforcing_consecutive_5xx: 100
        enforcing_consecutive_gateway_failure: 100
        interval: 1s
        base_ejection_time: 5s
        max_ejection_time: 30s
        # 100% so a fully dead upstream can actually reach zero healthy hosts.
        # The aggregate breaker, not Envoy, decides what subscribers are told.
        max_ejection_percent: 100
        # Ratio-based detection scales cleanly with replica count; consecutive
        # counts get effectively divided by the size of the fleet. This only
        # evaluates at all because every cluster below has at least
        # failure_percentage_minimum_hosts endpoints - with a single host per
        # cluster it is dead configuration.
        failure_percentage_threshold: 50
        failure_percentage_minimum_hosts: 3
        failure_percentage_request_volume: 30
        enforcing_failure_percentage: 100
        # Separate "upstream returned 503" from "we could not connect".
        split_external_local_origin_errors: true
        # Only meaningful with the health_checks block below: without active
        # health checking this flag is inert, and a recovered upstream stays
        # ejected for base_ejection_time x ejection_count regardless.
        successful_active_health_check_uneject_host: true
      # Layer 3 - active health checking, which is what makes the un-eject
      # flag above real. /__health samples the same failing service normal
      # traffic does (see infra/flaky-upstream.mjs), so at a partial failure
      # rate hosts go unhealthy independently rather than all at once - which
      # is what lets a replica report healthy < total and vote DEGRADED.
      health_checks: &health_checks
        # The daemons give a call 2s. A health check that gave up sooner ejected every
        # host of an upstream answering in 1.5s — calls that would all have succeeded —
        # and opened the circuit on it (chaos scenario flaky-slow-healthcheck).
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: /__health
    - name: shipping-rates
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: shipping-rates
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8090 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8091 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8092 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8093 }
      circuit_breakers: *circuit_breakers
      outlier_detection: *outlier_detection
      health_checks: *health_checks
    - name: tax-calc
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: tax-calc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8094 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8095 }
              - endpoint:
                  address:
                    socket_address: { address: flaky-upstream, port_value: 8096 }
      circuit_breakers: *circuit_breakers
      outlier_detection: *outlier_detection
      health_checks: *health_checks
