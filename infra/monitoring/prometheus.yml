global:
  scrape_interval: 2s # fast enough that an incident shows up within a tick or two

# The fleet-wide open fraction and its alert. See rules.yml.
rule_files: [rules.yml]

# The alert goes to Alertmanager, which groups it and forwards it to a receiver that logs (infra/alert-sink.mjs).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # RabbitMQ's own exporter (`rabbitmq_prometheus`, enabled in the management image on 15692). Two jobs, because
  # the plain endpoint aggregates every queue metric into a cluster-wide sum with no `queue` label; per-queue
  # series live behind /metrics/detailed, opted into by family.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      # Depth, consumers and flow (published, acked, redelivered) per queue: the broker's to report, because an
      # application counter dies with its process and never sees a redelivery or a restart.
      family: [queue_coarse_metrics, queue_consumer_count, queue_metrics, queue_delivery_metrics, queue_exchange_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rmq-producer
    static_configs:
      - targets: ["rmq-producer:9464"]

  # The consumer fleet: one compose service scaled to N, so there are no container names to enumerate. Docker's
  # DNS returns an A record per replica.
  - job_name: rmq-consumer-fleet
    dns_sd_configs:
      - names: ["rmq-consumer"]
        type: A
        port: 9464
    # Matching the scrape interval, so a replica scaled away stops being scraped about as fast as it stopped existing.
