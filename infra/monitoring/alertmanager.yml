# Where the rules in alerts.yml actually go.
#
# Prometheus has been evaluating six rules and routing them nowhere, which is
# the same shape of failure the rules themselves are about: something that
# looks like it is working because it is running. An alert that reaches only
# Prometheus's own /alerts page is a rule with an audience of whoever thinks
# to look.
#
# The receiver here is a webhook to a container that logs what it gets
# (infra/alert-sink.mjs). That is deliberately not Slack or PagerDuty: this
# repo cannot own someone else's credentials, and the property worth
# demonstrating is that a firing rule reaches a destination outside
# Prometheus. Swap the URL for a real integration and nothing else changes.

global:
  resolve_timeout: 1m

route:
  receiver: sink
  # Group by alert and API so a fleet-wide problem is one notification rather
  # than one per instance — the same reasoning as the aggregator's dwell time.
  group_by: [alertname, apiId]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    # Criticals page immediately and repeat more often; warnings can wait for
    # the group to fill.
    - matchers: [severity="critical"]
      receiver: sink
      group_wait: 0s
      repeat_interval: 15m

# One incident, not six notifications: while the control loop is stalled,
# everything downstream of it is also true and none of it is the cause.
inhibit_rules:
  - source_matchers: [alertname="ControlLoopStalled"]
    target_matchers: [severity=~"warning|critical"]
    equal: [apiId]
  - source_matchers: [alertname="NoLeaderElected"]
    target_matchers: [alertname="DeliveryContractBroken"]
    equal: [apiId]

receivers:
  - name: sink
    webhook_configs:
      - url: http://alert-sink:9095/alerts
        send_resolved: true
